<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>場邊・籃球策略實驗室</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/src/fonts.css"><link rel="stylesheet" href="/src/style.css"></head>
<body><div id="status-strip" aria-label="比賽狀態"></div><header class="topbar"><div class="brand"><span class="brand-icon">球</span><div><b>場邊 COURTSIDE</b><small>籃球策略實驗室 / 聖誕大戰回合策略</small></div></div><div class="header-actions"><div id="play-modes"></div><button id="tutorial">新手教學</button><span id="save-status">本機自動儲存</span><button id="undo">復原</button><button id="branch">儲存分支</button></div></header>
<section class="intro"><div><p class="eyebrow">2015.12.25 · 克里夫蘭騎士 × 金州勇士</p><h1>一段策略，讓球員執行。</h1><p>預設以區段配置陣容與攻防，最後兩分鐘管理關鍵攻防；也可切回原有逐回合模式。</p></div><span class="intro-tag">實際逐球作起點，區段分布看可能</span></section>
<main class="workspace"><aside class="sidebar"><details class="start-panel"><summary>選擇起點與分支</summary><nav id="scenarios" aria-label="比賽情境"></nav><h2 class="branch-heading">分支筆記</h2><nav id="branches" aria-label="儲存分支"></nav></details></aside>
<section class="center"><div id="situation"></div><section id="feedback" aria-live="polite" hidden></section><section class="decision-panel"><div class="section-title"><h2 id="decision-heading">本段決策</h2></div><div id="actions"></div><div id="layers"></div><section id="verify-plan"><h3>驗證本單</h3><div id="plan-comparison"></div></section><details id="analysis-details"><summary>模型、論點與依據</summary><div id="model-selectors"></div><div id="distribution"></div><div id="model-comparison"></div><section class="analysis-panel"><div class="section-title"><h2>決策的兩面</h2><span id="source" class="tag">規則引擎</span></div><div id="analysis"></div></section><div id="simulation"></div></details></section><details><summary>詳細比分與場上陣容</summary><div id="scoreboard"></div><div id="team-state"></div><div id="matchup"></div><div id="court"></div></details><details class="history"><summary>短回合紀錄・含自動前進</summary><ol id="log"></ol></details></section>
<aside class="right"><div class="section-title"><h2>球隊資源</h2><span class="tag">點選球員查看</span></div><div id="resources"></div></aside></main>
<section id="review" hidden aria-labelledby="review-heading"></section><div class="decision-bar" aria-label="決策操作"><p id="notice" role="status"></p><span id="current-choice"></span><button id="simulate">推演</button><button id="execute" class="primary">執行</button></div>
<footer>逐球完整回合 × SportVU 僅作細節重播 · 2015 年聖誕大戰 · 實驗性模型，非賽事預測 · 無帳號、無使用者追蹤</footer><dialog id="player-dialog"><button id="close-player" aria-label="關閉球員資料">關閉 ×</button><div id="player-detail"></div></dialog><dialog id="tutorial-dialog"><button id="close-tutorial">關閉 ×</button><div id="tutorial-content"></div></dialog><script type="module" src="/src/app.js"></script></body></html>
